[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optcgsim-studio"
version = "0.1.0"
description = "QoL, cosmétiques et synchronisation multi-appareils pour OPTCGSim (assets hot-swap sûrs, import universel de decklists, stockage offline-first)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
studio = "studio.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
"studio.db" = ["*.sql"]
