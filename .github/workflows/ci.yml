name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest · Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows est BLOQUANT depuis que la suite y passe (2026-09).
    #
    # Il était informatif, et c'est ce qui a laissé 32 tests rouges pendant un mois — donc
    # cinq bugs bien réels : le confinement zip-slip refusait TOUT import de pack, les
    # lectures sans encodage rendaient illisible toute decklist accentuée, et une clé de
    # cible en séparateur natif faisait importer les packs sans reconnaître une seule carte.
    # Un signal qu'on tolère en rouge finit par ne plus rien signaler.
    #
    # À ne pas confondre avec une garantie plus large : la cartographie des chemins Unity
    # n'est toujours PAS confirmée sur machine réelle (`gamepaths.py` la marque
    # `verified=False`). La suite passe, ce qui n'est pas la même affirmation.
    strategy:
      fail-fast: false
      matrix:
        # Toutes les versions couvertes par `requires-python = ">=3.10"`. Un support annoncé
        # mais non testé est un bug d'installation silencieux.
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Le studio écrit dans une VRAIE installation de jeu, et la cartographie des chemins
          # n'est confirmée que sur macOS (cf. gamepaths.py) — on y teste au moins une version.
          - python: "3.12"
            os: macos-latest
          # Windows : chemins Unity `AppData/LocalLow`, séparateurs, casse du système de
          # fichiers. Non vérifié sur machine réelle, d'où l'intérêt de le tenir en CI.
          - python: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installer (paquet + pytest uniquement)
        # Volontairement PAS de `pip install -r requirements.txt` : le projet ne doit rien
        # tirer d'autre. Si un `import` externe s'était glissé dans studio/, l'étape suivante
        # échouerait — c'est exactement ce que vérifie tests/test_no_external_deps.py.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Le paquet ne déclare aucune dépendance tierce
        shell: bash
        # On interroge les métadonnées du paquet INSTALLÉ, au lieu d'énumérer tout ce qui
        # traîne dans l'environnement.
        #
        # La version précédente comparait `md.distributions()` à une liste blanche, et
        # échouait donc sur les paquets préinstallés dans les images de runner GitHub —
        # `typing_extensions` sur ubuntu/3.10, `pipx`/`click`/`filelock`/`platformdirs`/
        # `userpath`/`argcomplete` sur windows. Elle testait l'image, pas le projet, et
        # laissait la CI rouge en permanence. Aucune liste à maintenir ici.
        #
        # Complémentaire, pas redondant : tests/test_no_external_deps.py analyse l'AST de
        # studio/ pour interdire tout `import` tiers ; cette étape couvre l'autre moitié,
        # une dépendance déclarée dans pyproject.toml sans être encore importée.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          reqs = md.requires("optcgsim-studio") or []
          # Les extras sont conditionnels et facultatifs par construction : seules les
          # dépendances d'exécution inconditionnelles violent la promesse « zéro dépendance ».
          dures = sorted(r for r in reqs if "extra ==" not in r)
          print("Dépendances d'exécution déclarées :", dures or "aucune")
          assert not dures, f"le paquet déclare des dépendances tierces : {dures}"
          PY

      - name: Suite de tests
        run: python -m pytest -q

      - name: Le point d'entrée `studio` répond
        # Un `console_scripts` cassé ne se voit dans aucun test unitaire.
        run: |
          studio --help
          studio assets --help

  integrite-git:
    name: Rien de sensible n'est versionné
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun secret ni état local dans le dépôt
        shell: bash
        run: |
          # Le token GitHub vit dans ~/.optcgsim-studio/ (hors dépôt) et ne doit jamais être
          # committé — cf. studio/config.py et le garde-fou de SECURITY.md.
          mauvais=$(git ls-files | grep -Ei '(^|/)(config\.json|credentials|\.env|.*\.pem|.*\.key)$' || true)
          if [ -n "$mauvais" ]; then
            echo "Fichiers sensibles versionnés :"; echo "$mauvais"; exit 1
          fi
          echo "OK — rien de sensible versionné."
